<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cotización - MoveAndes</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo-container">
                <a href="index.html">
                    <img src="assets/img/logomovimiento.gif" alt="MoveAndes Logo" class="nav-logo">
                </a>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="cotizacion.html" class="btn-cta active">Solicitar Cotización</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="max-width: 700px; margin: 3rem auto; background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <h2 style="color: var(--primary-blue); margin-bottom: 1.5rem; text-align: center;">Solicita tu Cotización Personalizada</h2>
        <form action="backend/procesar_cotizacion.php" method="POST">
            
            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Nombre Completo:</label>
                <input type="text" name="nombre" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Teléfono / WhatsApp:</label>
                <input type="tel" name="telefono" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Correo Electrónico:</label>
                <input type="email" name="email" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 1.2rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Tipo de Servicio:</label>
                <select name="tipo_servicio" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="">Seleccione una opción</option>
                    <option value="Residencial">Mudanza Residencial (Casa / Departamento)</option>
                    <option value="Corporativo">Mudanza Corporativa / Oficina</option>
                    <option value="Embalaje">Servicio de Empaque y Embalaje</option>
                    <option value="Carga">Transporte de Carga General</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 1.2rem;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Ciudad / Dirección de Origen:</label>
                    <input type="text" name="origen" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Ciudad / Dirección de Destino:</label>
                    <input type="text" name="destino" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <div style="flex: 1;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Fecha Tentativa:</label>
                    <input type="date" name="fecha_mudanza" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Hora Preferida:</label>
                    <input type="time" name="hora_mudanza" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Detalles adicionales (muebles grandes, pisos, etc.):</label>
                <textarea name="detalles" rows="4" style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            </div>

            <button type="submit" class="btn-cta" style="width: 100%; padding: 1rem; border: none; font-size: 1.1rem; cursor: pointer; border-radius: 4px;">Enviar Solicitud de Cotización</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 MoveAndes. Todos los derechos reservados.</p>
    </footer>

    <script src="assets/js/main.js"></script>

</body>
</html>
